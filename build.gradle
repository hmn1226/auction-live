plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.2' // Node.jsプラグイン
}

// Spring Boot DevTools設定
tasks.named('bootRun') {
    // JVMオプションの設定
    jvmArgs = [
        '-Dspring.devtools.restart.enabled=true',
        '-Dspring.devtools.livereload.enabled=true',
        '-Dspring.devtools.restart.poll-interval=500',
        '-Dspring.devtools.restart.quiet-period=200'
    ]
    // ファイル変更時に自動的にコンパイルを実行
    sourceResources sourceSets.main
}

// 継続的なビルドを行うタスク
task continuousBuild {
    doLast {
        println "継続的なビルドを開始します..."
        println "ファイル変更を監視しています..."
        println "終了するにはCtrl+Cを押してください"
    }
}

// continuousBuildタスクを--continuousフラグ付きで実行
tasks.named('continuousBuild') {
    finalizedBy 'build'
}

// ファイル変更を監視して自動的にコンパイルを実行
tasks.named('compileJava') {
    options.compilerArgs << '-parameters'
    options.fork = true
    options.incremental = true
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven {
        url "https://plugins.gradle.org/m2/" // Gradleプラグインリポジトリ
    }
}

// フロントエンドの設定
node {
    version = '20.11.1' // Node.jsのバージョン
    npmVersion = '10.2.4' // npmのバージョン
    download = true // 必要に応じてNode.jsをダウンロード
    workDir = file("${project.projectDir}/frontend") // Node.jsの作業ディレクトリ
    nodeProjectDir = file("${project.projectDir}/frontend") // プロジェクトディレクトリ
}

// フロントエンドのビルドタスク
task installFrontend(type: NpmTask) {
    description = 'フロントエンドの依存関係をインストール'
    args = ['install']
}

task buildFrontend(type: NpmTask) {
    description = 'フロントエンドをビルド'
    args = ['run', 'build']
    dependsOn installFrontend
}

// フロントエンドのビルド成果物をSpringの静的リソースディレクトリにコピー
task copyFrontendBuild(type: Copy) {
    description = 'フロントエンドのビルド成果物をSpringの静的リソースディレクトリにコピー'
    from "${project.projectDir}/frontend/build"
    into "${project.projectDir}/src/main/resources/static"
    dependsOn buildFrontend
}

// Springのビルドプロセスにフロントエンドのビルドを統合
processResources.dependsOn copyFrontendBuild

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    compileOnly 'org.projectlombok:lombok'
    // DevToolsを実行時クラスパスに追加
    runtimeOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'commons-beanutils:commons-beanutils:1.9.4'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    runtimeOnly 'com.h2database:h2'

    // ULID
    implementation group: 'de.huxhorn.sulky', name: 'de.huxhorn.sulky.ulid', version: '8.3.0'
    
    // AWS SES
    implementation group: 'software.amazon.awssdk', name: 'ses', version: '2.30.31'
}
